<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Finance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div>
    <h1>Welcome to Finance Tracker</h1>
</div>
    <div>
        <h2> Login </h2>
        <input type="text" placeholder="Username" name="username" id="login-username">
        <input type="password" placeholder="Password" name="password" id="login-password">
        <button onclick="login()">Login</button>
    </div>

    <div>
        <h2> Sign Up </h2>
        <input type = "text" placeholder="Username" name="sign_up_username" id="signup-username">
        <input type = "password" placeholder="Password" name="sign_up_password" id="signup-password">
        <button onclick="signup()">Sign Up</button>
    </div>

    <div>
        <br>
        <br>
        <br>
        <button onclick="window.location.href='reset.html'"> Forgot Password </button>

    </div>
<script src = "JScript.js"> </script>
</body>
</html>
